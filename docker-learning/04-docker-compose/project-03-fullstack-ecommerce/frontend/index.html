<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 CloudMart - Dockerized Full-Stack eCommerce</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #233354;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --success: #34d399;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 9999px;
      font-size: 0.85rem;
      color: var(--success);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
    }
    main {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 16px;
      box-sizing: border-box;
      flex: 1;
    }
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin: 0 0 12px;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto;
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .stat-pill span {
      color: var(--accent);
      font-weight: 700;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .product-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .product-price {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .product-stock {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .btn-buy {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-buy:hover {
      opacity: 0.9;
    }
    .btn-buy:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    #notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🐳 CloudMart Stack</div>
    <div class="status-badge">
      <div class="dot"></div>
      <span id="stack-status">Checking Stack...</span>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>Full-Stack Docker Compose Store</h1>
      <p>This store is running with Frontend (Nginx), Backend (Node), Database (MySQL), and Cache (Redis) isolated in private containers.</p>
      <div class="stats-bar">
        <div class="stat-pill">Cache Status: <span id="cache-status">Querying...</span></div>
        <div class="stat-pill">API Latency: <span id="api-latency">-- ms</span></div>
      </div>
    </div>

    <div class="products-grid" id="products-list">
      <!-- Loaded dynamically via /api/products -->
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">
        Loading products from microservices...
      </div>
    </div>
  </main>

  <div id="notification"></div>

  <script>
    const notify = (msg) => {
      const el = document.getElementById("notification");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => el.style.display = "none", 4000);
    };

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (data.status === "healthy") {
          document.getElementById("stack-status").textContent = "All 4 Services Healthy";
        }
      } catch (err) {
        document.getElementById("stack-status").textContent = "Backend Offline";
      }
    }

    async function loadProducts() {
      try {
        const res = await fetch("/api/products");
        const json = await res.json();

        document.getElementById("cache-status").textContent = json.cached ? "⚡ REDIS HIT" : "🗄️ MYSQL DB (Fresh)";
        document.getElementById("api-latency").textContent = json.latencyMs + " ms";

        const container = document.getElementById("products-list");
        container.innerHTML = "";

        json.products.forEach(p => {
          const card = document.createElement("div");
          card.className = "product-card";
          card.innerHTML = `
            <div>
              <div class="product-title">${p.name}</div>
              <div class="product-price">$${Number(p.price).toFixed(2)}</div>
              <div class="product-stock">In Stock: <strong>${p.stock}</strong> units</div>
            </div>
            <button class="btn-buy" ${p.stock <= 0 ? "disabled" : ""} onclick="buyProduct(${p.id}, '${p.name}')">
              ${p.stock > 0 ? "Purchase Item" : "Sold Out"}
            </button>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById("products-list").innerHTML =
          `<p style="color:#ef4444;text-align:center;">Failed to connect to backend API.</p>`;
      }
    }

    async function buyProduct(productId, name) {
      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            productId,
            quantity: 1,
            email: "student@docker.local"
          })
        });
        const data = await res.json();
        if (res.ok) {
          notify(`🎉 Purchased 1x ${name}! Remaining: ${data.remainingStock}`);
          loadProducts();
        } else {
          notify(`❌ Error: ${data.error}`);
        }
      } catch (e) {
        notify("Failed to submit order");
      }
    }

    checkHealth();
    loadProducts();
  </script>
</body>
</html>
