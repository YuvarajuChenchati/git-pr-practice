# ==============================================================================
# Production Docker Compose for AWS EC2 Deployment
# Orchestrates API + Nginx Reverse Proxy + Let's Encrypt SSL
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Application API Service (Pulled directly from AWS ECR)
  # ----------------------------------------------------------------------------
  api:
    image: ${ECR_REGISTRY_URL}/production-api:latest
    container_name: production_api
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
    networks:
      - prod_internal_net
    # Notice: Port 3000 is NOT exposed to public internet! Only Nginx can talk to it.

  # ----------------------------------------------------------------------------
  # 2. Production Nginx Reverse Proxy (SSL Termination & Rate Limiting)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: production_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - prod_internal_net

  # ----------------------------------------------------------------------------
  # 3. Let's Encrypt Certbot (Automated SSL Certificate Generator & Renewer)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: production_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  prod_internal_net:
    driver: bridge
