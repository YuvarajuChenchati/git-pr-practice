# ==============================================================================
# Production Nginx Reverse Proxy Configuration
# Handles Let's Encrypt challenge, SSL termination, and proxies to Node API
# ==============================================================================

# Rate limiting zone: max 20 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenge verification over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all traffic to API (or redirect to HTTPS when SSL cert is present)
    location / {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
