# ==============================================================================
# Kubernetes Service: Internal Load Balancer across our 3 Replicas
# Replaces Docker port mapping with cluster networking & automatic load balancing
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: lms-api-service
spec:
  type: LoadBalancer # Or ClusterIP / NodePort
  selector:
    app: lms-api     # Directs traffic to all pods matching label 'app: lms-api'
  ports:
    - protocol: TCP
      port: 80       # Public port on the load balancer
      targetPort: 3000 # Internal port of the container
