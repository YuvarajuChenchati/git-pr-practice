apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-app
  labels:
    app: hardened-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hardened-app
  template:
    metadata:
      labels:
        app: hardened-app
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          # cgroups CPU and Memory allocation
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"       # 50 millicores = 5% of 1 CPU core
            limits:
              memory: "128Mi"
              cpu: "200m"      # 20% of 1 CPU core
          # Readiness Probe: Don't route traffic until this returns HTTP 200
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness Probe: Kill and restart container if this fails 3 times
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
