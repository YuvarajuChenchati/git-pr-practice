global:
  scrape_interval: 15s     # Scrape metrics every 15 seconds
  evaluation_interval: 15s # Evaluate alert rules every 15 seconds

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load rule files once and periodically evaluate them
rule_files:
  - "alert-rules.yaml"

# Scrape Configurations
scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Host Machine Metrics (CPU, RAM, Disk I/O)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Application REST API Metrics (/metrics endpoint)
  - job_name: 'diagnostic-api'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-service:3000']
